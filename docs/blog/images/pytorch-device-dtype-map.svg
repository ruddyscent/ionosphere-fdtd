<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch device and dtype selection map</title>
  <desc id="desc">A decision map compares CPU, Apple MPS, and NVIDIA CUDA. CPU supports float32 and float64 and configurable threads. MPS uses float32 in this backend. CUDA supports float32 and float64 and is appropriate for long compiled runs. Precision should be selected by validating the target observable.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#647689"/></marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .card-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .badge { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#fff"/>
  <text class="title" x="40" y="45">Choose the device first, then validate the precision</text>
  <text class="subtitle" x="40" y="71">The fastest supported dtype is not automatically accurate enough, and the most precise dtype is not available on every device.</text>

  <rect x="430" y="98" width="340" height="66" rx="15" fill="#eef3f7" stroke="#bdcbd7"/>
  <text class="label" x="600" y="124" text-anchor="middle">What is this run for?</text>
  <text class="small" x="600" y="147" text-anchor="middle">development · exploration · quantitative verification</text>

  <path d="M600 164 L600 194" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 190 C390 190 260 202 220 227" fill="none" stroke="#647689" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600 190 L600 227" stroke="#647689" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600 190 C810 190 940 202 980 227" fill="none" stroke="#647689" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CPU -->
  <rect x="40" y="228" width="350" height="250" rx="18" fill="#f5fafe" stroke="#9fbed2" stroke-width="1.5"/>
  <text class="card-title" x="65" y="264">PyTorch CPU</text>
  <rect x="65" y="282" width="116" height="28" rx="14" fill="#deedf6"/>
  <text class="badge" x="123" y="301" text-anchor="middle" fill="#286f9a">float32</text>
  <rect x="190" y="282" width="116" height="28" rx="14" fill="#e9e1f3"/>
  <text class="badge" x="248" y="301" text-anchor="middle" fill="#684695">float64</text>
  <text class="label" x="65" y="340">Good fit</text>
  <text class="small" x="65" y="363">small and medium runs</text>
  <text class="small" x="65" y="384">backend equivalence checks</text>
  <text class="small" x="65" y="405">machines without an accelerator</text>
  <line x1="65" y1="422" x2="365" y2="422" stroke="#cbd7e0"/>
  <text class="tiny" x="65" y="443">Tune intra-op threads for the actual grid.</text>
  <text class="tiny" x="65" y="462">No host–device transfer boundary.</text>

  <!-- MPS -->
  <rect x="425" y="228" width="350" height="250" rx="18" fill="#fbf9fe" stroke="#b7a5d1" stroke-width="1.5"/>
  <text class="card-title" x="450" y="264">Apple MPS</text>
  <rect x="450" y="282" width="116" height="28" rx="14" fill="#deedf6"/>
  <text class="badge" x="508" y="301" text-anchor="middle" fill="#286f9a">float32</text>
  <rect x="575" y="282" width="156" height="28" rx="14" fill="#f4deda"/>
  <text class="badge" x="653" y="301" text-anchor="middle" fill="#a14f47">float64 rejected</text>
  <text class="label" x="450" y="340">Good fit</text>
  <text class="small" x="450" y="363">interactive exploration on Apple Silicon</text>
  <text class="small" x="450" y="384">longer float32 development runs</text>
  <text class="small" x="450" y="405">visualization with explicit observation cadence</text>
  <line x1="450" y1="422" x2="750" y2="422" stroke="#d5cbe1"/>
  <text class="tiny" x="450" y="443">Unified physical memory does not remove the</text>
  <text class="tiny" x="450" y="462">logical device and synchronization boundary.</text>

  <!-- CUDA -->
  <rect x="810" y="228" width="350" height="250" rx="18" fill="#f7fbf9" stroke="#9abfaf" stroke-width="1.5"/>
  <text class="card-title" x="835" y="264">NVIDIA CUDA</text>
  <rect x="835" y="282" width="116" height="28" rx="14" fill="#deedf6"/>
  <text class="badge" x="893" y="301" text-anchor="middle" fill="#286f9a">float32</text>
  <rect x="960" y="282" width="116" height="28" rx="14" fill="#e9e1f3"/>
  <text class="badge" x="1018" y="301" text-anchor="middle" fill="#684695">float64</text>
  <text class="label" x="835" y="340">Good fit</text>
  <text class="small" x="835" y="363">large production grids</text>
  <text class="small" x="835" y="384">long static-shape compiled runs</text>
  <text class="small" x="835" y="405">double-precision verification when required</text>
  <line x1="835" y1="422" x2="1135" y2="422" stroke="#c9dbd3"/>
  <text class="tiny" x="835" y="443">Benchmark eager and compiled modes.</text>
  <text class="tiny" x="835" y="462">Keep fields and observations device-native.</text>

  <path d="M215 479 C215 515 415 514 494 523" fill="none" stroke="#647689" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 479 L600 520" stroke="#647689" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M985 479 C985 515 785 514 706 523" fill="none" stroke="#647689" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="404" y="522" width="392" height="66" rx="15" fill="#f7f1df" stroke="#c6a051"/>
  <text class="label" x="600" y="548" text-anchor="middle">Validate the observable of interest</text>
  <text class="small" x="600" y="570" text-anchor="middle">field error · attenuation · phase · arrival time</text>
  <text class="tiny" x="1160" y="608" text-anchor="end">Automatic PyTorch dtype is float32 on CPU, MPS, and CUDA; request float64 explicitly where supported.</text>
</svg>
