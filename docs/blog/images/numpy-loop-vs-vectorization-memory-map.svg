<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Memory map comparing scalar Python loops with NumPy vectorization</title>
  <desc id="desc">The left panel reads one head and tail scalar for every edge and radial-layer pair. The right panel gathers complete head and tail rows from the E r array and subtracts the two gathered matrices in one NumPy expression.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #172033; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .code { fill: #172033; stroke: #0f172a; stroke-width: 2; }
      .code-text { fill: #f8fafc; font-family: "DejaVu Sans Mono", monospace; font-size: 18px; }
      .heading { font-size: 27px; font-weight: 700; }
      .panel-heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .grid { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .tail { fill: #fed7aa; stroke: #ea580c; stroke-width: 2; }
      .head { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2; }
      .result { fill: #bbf7d0; stroke: #16a34a; stroke-width: 2; }
      .current { fill: #fef3c7; stroke: #f59e0b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="white"/>
  <text x="32" y="43" class="heading">The same edge difference, two execution models</text>

  <rect x="25" y="66" width="555" height="600" rx="16" class="panel"/>
  <text x="50" y="102" class="panel-heading">Scalar Python loop</text>
  <rect x="49" y="119" width="507" height="112" rx="10" class="code"/>
  <text x="67" y="149" class="code-text">for e in range(N_e):</text>
  <text x="67" y="179" class="code-text">    for k in range(N_r + 1):</text>
  <text x="67" y="209" class="code-text">        out[e,k] = er[head[e],k] - er[tail[e],k]</text>

  <text x="55" y="271" class="label">E_r memory</text>
  <text x="55" y="293" class="small">surface entity x radial layer</text>
  <rect x="72" y="318" width="220" height="150" fill="white"/>
  <rect x="72" y="348" width="220" height="30" class="tail"/>
  <rect x="72" y="408" width="220" height="30" class="head"/>
  <path d="M72 318H292V468H72Z M116 318V468 M160 318V468 M204 318V468 M248 318V468 M72 348H292 M72 378H292 M72 408H292 M72 438H292" class="grid"/>
  <text x="88" y="310" class="tiny">k0</text><text x="132" y="310" class="tiny">k1</text><text x="176" y="310" class="tiny">k2</text><text x="220" y="310" class="tiny">k3</text><text x="264" y="310" class="tiny">k4</text>
  <text x="48" y="339" class="tiny">v0</text><text x="48" y="369" class="tiny">v1</text><text x="48" y="399" class="tiny">v2</text><text x="48" y="429" class="tiny">v3</text><text x="48" y="459" class="tiny">v4</text>
  <text x="301" y="368" class="small" fill="#ea580c">tail[e]</text>
  <text x="301" y="428" class="small" fill="#2563eb">head[e]</text>

  <path d="M337 392 C382 392, 395 375, 425 375" class="arrow"/>
  <text x="410" y="284" class="label">out memory</text>
  <rect x="425" y="318" width="110" height="150" fill="white"/>
  <rect x="447" y="348" width="22" height="30" class="current"/>
  <path d="M425 318H535V468H425Z M447 318V468 M469 318V468 M491 318V468 M513 318V468 M425 348H535 M425 378H535 M425 408H535 M425 438H535" class="grid"/>
  <text x="433" y="310" class="tiny">k0</text><text x="455" y="310" class="tiny">k1</text><text x="477" y="310" class="tiny">k2</text><text x="499" y="310" class="tiny">k3</text><text x="521" y="310" class="tiny">k4</text>
  <text x="405" y="339" class="tiny">e0</text><text x="405" y="369" class="tiny">e1</text><text x="405" y="399" class="tiny">e2</text><text x="405" y="429" class="tiny">e3</text><text x="405" y="459" class="tiny">...</text>
  <text x="386" y="492" class="small">one cell per loop body</text>

  <rect x="50" y="525" width="505" height="105" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="68" y="553" class="label">Python dispatch repeats N_e(N_r + 1) times</text>
  <text x="68" y="583" class="small">[e0,k0] -> [e0,k1] -> ... -> [e1,k0] -> ...</text>
  <text x="68" y="609" class="small">Scalar arithmetic repeats despite contiguous k storage.</text>

  <rect x="620" y="66" width="555" height="600" rx="16" class="panel"/>
  <text x="645" y="102" class="panel-heading">Vectorized NumPy expression</text>
  <rect x="644" y="119" width="507" height="72" rx="10" class="code"/>
  <text x="662" y="164" class="code-text">out = er[head, :] - er[tail, :]</text>

  <text x="650" y="228" class="label">E_r memory</text>
  <rect x="655" y="254" width="180" height="150" fill="white"/>
  <rect x="655" y="284" width="180" height="30" class="tail"/>
  <rect x="655" y="344" width="180" height="30" class="head"/>
  <path d="M655 254H835V404H655Z M691 254V404 M727 254V404 M763 254V404 M799 254V404 M655 284H835 M655 314H835 M655 344H835 M655 374H835" class="grid"/>
  <text x="666" y="246" class="tiny">k0</text><text x="702" y="246" class="tiny">k1</text><text x="738" y="246" class="tiny">k2</text><text x="774" y="246" class="tiny">k3</text><text x="810" y="246" class="tiny">k4</text>
  <text x="632" y="275" class="tiny">v0</text><text x="632" y="305" class="tiny">v1</text><text x="632" y="335" class="tiny">v2</text><text x="632" y="365" class="tiny">v3</text><text x="632" y="395" class="tiny">v4</text>
  <text x="666" y="426" class="small" fill="#ea580c">tail rows</text>
  <text x="758" y="426" class="small" fill="#2563eb">head rows</text>

  <path d="M842 293 C870 293, 870 270, 897 270" class="arrow"/>
  <path d="M842 363 C870 363, 870 381, 897 381" class="arrow"/>
  <text x="851" y="327" class="tiny">integer-array</text>
  <text x="857" y="345" class="tiny">gather</text>

  <text x="900" y="221" class="label" fill="#2563eb">head gather</text>
  <rect x="900" y="235" width="220" height="95" class="head"/>
  <path d="M900 235H1120V330H900Z M944 235V330 M988 235V330 M1032 235V330 M1076 235V330 M900 259H1120 M900 283H1120 M900 307H1120" class="grid"/>
  <text x="900" y="363" class="label" fill="#ea580c">tail gather</text>
  <rect x="900" y="377" width="220" height="95" class="tail"/>
  <path d="M900 377H1120V472H900Z M944 377V472 M988 377V472 M1032 377V472 M1076 377V472 M900 401H1120 M900 425H1120 M900 449H1120" class="grid"/>

  <path d="M1010 479V514" class="arrow"/>
  <text x="1023" y="503" class="small">ufunc subtraction</text>
  <text x="900" y="543" class="label" fill="#16a34a">out: (N_e, N_r + 1)</text>
  <rect x="900" y="555" width="220" height="72" class="result"/>
  <path d="M900 555H1120V627H900Z M944 555V627 M988 555V627 M1032 555V627 M1076 555V627 M900 579H1120 M900 603H1120" class="grid"/>

  <rect x="644" y="456" width="240" height="171" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="662" y="486" class="label">One Python expression</text>
  <text x="662" y="516" class="small">1. gather full rows</text>
  <text x="662" y="543" class="small">2. subtract in native code</text>
  <text x="662" y="576" class="small">Advanced indexing creates</text>
  <text x="662" y="599" class="small">temporary head/tail arrays;</text>
  <text x="662" y="622" class="small">vectorized is not zero-copy.</text>

</svg>
