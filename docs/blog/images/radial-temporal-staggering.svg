<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Radial and temporal staggering of the spherical FDTD fields</title>
  <desc id="desc">The radial stack alternates TM-r planes at integer radial nodes, carrying Er and Ht, with TE-r planes at radial midpoints, carrying Hr and Et. Spacing can be nonuniform. A time timeline shows electric fields at integer steps and magnetic fields at half steps in leapfrog order.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#647689"/></marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .panel-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .field { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .formula { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3c5267; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#fff"/>
  <text class="title" x="40" y="45">The fields are staggered in radius and in time</text>
  <text class="subtitle" x="40" y="71">Radial staggering aligns finite differences; leapfrog timing alternates Faraday and Ampère updates.</text>

  <!-- Radial panel -->
  <rect x="34" y="98" width="566" height="500" rx="18" fill="#f7fafc" stroke="#b7c7d5"/>
  <text class="panel-title" x="58" y="134">Spherical shell stack</text>
  <text class="small" x="58" y="156">schematic cross-section · unequal Δr allowed</text>

  <path d="M104 535 L104 187" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="78" y="554">radius r</text>

  <!-- TM planes -->
  <g>
    <rect x="128" y="476" width="410" height="15" rx="7" fill="#dcecf6" stroke="#2878a8"/>
    <rect x="128" y="348" width="410" height="15" rx="7" fill="#dcecf6" stroke="#2878a8"/>
    <rect x="128" y="230" width="410" height="15" rx="7" fill="#dcecf6" stroke="#2878a8"/>
  </g>
  <g class="label" fill="#286f9a">
    <text x="146" y="470">TM-r plane r_i</text>
    <text x="146" y="342">TM-r plane r_i+1</text>
    <text x="146" y="224">TM-r plane r_i+2</text>
  </g>
  <g class="field" fill="#286f9a">
    <text x="358" y="470">E_r (cells) · H_t (edges)</text>
    <text x="358" y="342">E_r (cells) · H_t (edges)</text>
    <text x="358" y="224">E_r (cells) · H_t (edges)</text>
  </g>

  <!-- TE planes -->
  <g>
    <rect x="154" y="409" width="358" height="12" rx="6" fill="#e9e1f3" stroke="#7453a6"/>
    <rect x="154" y="287" width="358" height="12" rx="6" fill="#e9e1f3" stroke="#7453a6"/>
  </g>
  <g class="label" fill="#684695">
    <text x="170" y="401">TE-r plane r_i+1/2</text>
    <text x="170" y="279">TE-r plane r_i+3/2</text>
  </g>
  <g class="field" fill="#684695">
    <text x="364" y="401">H_r (faces) · E_t (edges)</text>
    <text x="364" y="279">H_r (faces) · E_t (edges)</text>
  </g>

  <!-- Spacing annotations -->
  <path d="M551 483 L551 355" stroke="#8b9baa" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="formula" x="560" y="422">Δr_i</text>
  <path d="M551 355 L551 237" stroke="#8b9baa" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="formula" x="560" y="304">Δr_i+1</text>
  <rect x="142" y="516" width="382" height="43" rx="11" fill="#eef3f7"/>
  <text class="tiny" x="333" y="535" text-anchor="middle">D_r E_t lands on TM-r planes</text>
  <text class="tiny" x="333" y="551" text-anchor="middle">D_r H_t lands on TE-r planes</text>

  <!-- Time panel -->
  <rect x="628" y="98" width="538" height="500" rx="18" fill="#fbf9fe" stroke="#b7a5d1"/>
  <text class="panel-title" x="652" y="134">Leapfrog time sequence</text>
  <text class="small" x="652" y="156">electric fields at integer time · magnetic fields at half time</text>

  <path d="M688 324 L1110 324" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="1110" y="349" text-anchor="end">time</text>

  <g stroke="#9cacba" stroke-width="1.5">
    <line x1="714" y1="308" x2="714" y2="340"/><line x1="808" y1="308" x2="808" y2="340"/><line x1="902" y1="308" x2="902" y2="340"/><line x1="996" y1="308" x2="996" y2="340"/><line x1="1090" y1="308" x2="1090" y2="340"/>
  </g>

  <rect x="654" y="206" width="120" height="66" rx="12" fill="#deedf6" stroke="#2878a8"/>
  <text class="field" x="714" y="233" text-anchor="middle" fill="#286f9a">E^n</text>
  <text class="small" x="714" y="254" text-anchor="middle">E_r · E_t</text>
  <rect x="842" y="206" width="120" height="66" rx="12" fill="#deedf6" stroke="#2878a8"/>
  <text class="field" x="902" y="233" text-anchor="middle" fill="#286f9a">E^(n+1)</text>
  <text class="small" x="902" y="254" text-anchor="middle">E_r · E_t</text>
  <rect x="1030" y="206" width="120" height="66" rx="12" fill="#deedf6" stroke="#2878a8"/>
  <text class="field" x="1090" y="233" text-anchor="middle" fill="#286f9a">E^(n+2)</text>
  <text class="small" x="1090" y="254" text-anchor="middle">E_r · E_t</text>

  <rect x="748" y="376" width="120" height="66" rx="12" fill="#e9e1f3" stroke="#7453a6"/>
  <text class="field" x="808" y="403" text-anchor="middle" fill="#684695">H^(n+1/2)</text>
  <text class="small" x="808" y="424" text-anchor="middle">H_r · H_t</text>
  <rect x="936" y="376" width="120" height="66" rx="12" fill="#e9e1f3" stroke="#7453a6"/>
  <text class="field" x="996" y="403" text-anchor="middle" fill="#684695">H^(n+3/2)</text>
  <text class="small" x="996" y="424" text-anchor="middle">H_r · H_t</text>

  <path d="M774 239 C806 239 776 374 808 374" fill="none" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M868 409 C900 409 870 274 902 274" fill="none" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M962 239 C994 239 964 374 996 374" fill="none" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1056 409 C1088 409 1058 274 1090 274" fill="none" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="tiny" x="800" y="192" text-anchor="middle">Faraday: E^n → H^(n+1/2)</text>
  <text class="tiny" x="899" y="468" text-anchor="middle">Ampère: H^(n+1/2) → E^(n+1)</text>
  <rect x="678" y="503" width="438" height="61" rx="12" fill="#eee8f7"/>
  <text class="label" x="897" y="528" text-anchor="middle">one complete step</text>
  <text class="small" x="897" y="550" text-anchor="middle">advance H by half a step, then E by one full step</text>
  <text class="tiny" x="1160" y="625" text-anchor="end">Radial staggering and temporal staggering are independent: every field keeps both a spatial location and a time offset.</text>
</svg>
