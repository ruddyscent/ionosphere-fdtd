<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Source distribution without snapping to a grid point</title>
  <desc id="desc">A geographic source inside a primal triangle is represented by three barycentric vertex weights. Its altitude between two radial electric planes is represented by two linear radial weights. Their outer product produces at most six Er degrees of freedom whose weights sum to one. Dividing the current moment by each dual-cell area and radial control length preserves the total current moment.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#647689"/></marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .panel-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .formula { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #394e63; }
      .weight { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#fff"/>
  <text class="title" x="40" y="45">A physical source becomes a small weighted stencil</text>
  <text class="subtitle" x="40" y="71">Horizontal barycentric weights and radial linear weights combine without snapping latitude, longitude, or altitude.</text>

  <!-- Surface panel -->
  <rect x="34" y="98" width="520" height="350" rx="18" fill="#f6fafe" stroke="#a8c5d8"/>
  <text class="panel-title" x="58" y="134">1 · Locate the containing primal triangle</text>
  <polygon points="294,171 108,395 482,395" fill="#e5f1f8" stroke="#2878a8" stroke-width="3"/>
  <circle cx="294" cy="171" r="10" fill="#fff" stroke="#2878a8" stroke-width="3"/>
  <circle cx="108" cy="395" r="10" fill="#fff" stroke="#2878a8" stroke-width="3"/>
  <circle cx="482" cy="395" r="10" fill="#fff" stroke="#2878a8" stroke-width="3"/>
  <text class="weight" x="294" y="158" text-anchor="middle" fill="#286f9a">v0 · λ0</text>
  <text class="weight" x="88" y="419" text-anchor="middle" fill="#286f9a">v1 · λ1</text>
  <text class="weight" x="502" y="419" text-anchor="middle" fill="#286f9a">v2 · λ2</text>
  <circle cx="303" cy="307" r="13" fill="#b9821f" stroke="#fff" stroke-width="3"/>
  <path d="M303 307 L294 171 M303 307 L108 395 M303 307 L482 395" stroke="#b58628" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="label" x="322" y="293" fill="#946615">source direction</text>
  <rect x="148" y="355" width="294" height="28" rx="14" fill="#fff" opacity="0.92"/>
  <text class="formula" x="295" y="374" text-anchor="middle">λ0 + λ1 + λ2 = 1</text>

  <!-- Radial panel -->
  <rect x="586" y="98" width="580" height="350" rx="18" fill="#fbf9fe" stroke="#b7a5d1"/>
  <text class="panel-title" x="610" y="134">2 · Represent the exact altitude</text>
  <path d="M666 390 L666 169" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="640" y="415">altitude</text>
  <rect x="712" y="354" width="384" height="14" rx="7" fill="#deedf6" stroke="#2878a8"/>
  <rect x="712" y="194" width="384" height="14" rx="7" fill="#deedf6" stroke="#2878a8"/>
  <text class="label" x="730" y="345">E_r plane k · z_k</text>
  <text class="label" x="730" y="185">E_r plane k+1 · z_k+1</text>
  <circle cx="880" cy="286" r="13" fill="#b9821f" stroke="#fff" stroke-width="3"/>
  <line x1="880" y1="273" x2="880" y2="210" stroke="#b58628" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="880" y1="299" x2="880" y2="352" stroke="#b58628" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="label" x="902" y="282" fill="#946615">z_source</text>
  <text class="weight" x="902" y="241" fill="#684695">α</text>
  <text class="weight" x="902" y="326" fill="#684695">1 − α</text>
  <rect x="742" y="391" width="326" height="35" rx="12" fill="#eee8f7"/>
  <text class="formula" x="905" y="414" text-anchor="middle">(1−α) z_k + α z_k+1 = z_source</text>

  <!-- Combined weights -->
  <path d="M294 450 C294 482 430 474 462 497" fill="none" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M876 450 C876 482 740 474 708 497" fill="none" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214" y="500" width="772" height="106" rx="16" fill="#eef3f7" stroke="#c7d3de"/>
  <text class="label" x="600" y="526" text-anchor="middle">3 · Outer product → at most 3 × 2 E_r degrees of freedom</text>
  <g>
    <rect x="242" y="543" width="108" height="39" rx="8" fill="#dcecf6"/><rect x="360" y="543" width="108" height="39" rx="8" fill="#dcecf6"/><rect x="478" y="543" width="108" height="39" rx="8" fill="#dcecf6"/>
    <rect x="614" y="543" width="108" height="39" rx="8" fill="#e9e1f3"/><rect x="732" y="543" width="108" height="39" rx="8" fill="#e9e1f3"/><rect x="850" y="543" width="108" height="39" rx="8" fill="#e9e1f3"/>
  </g>
  <g class="weight" text-anchor="middle">
    <text x="296" y="568" fill="#286f9a">λ0(1−α)</text><text x="414" y="568" fill="#286f9a">λ1(1−α)</text><text x="532" y="568" fill="#286f9a">λ2(1−α)</text>
    <text x="668" y="568" fill="#684695">λ0α</text><text x="786" y="568" fill="#684695">λ1α</text><text x="904" y="568" fill="#684695">λ2α</text>
  </g>
  <text class="tiny" x="414" y="599" text-anchor="middle">lower plane k</text>
  <text class="tiny" x="786" y="599" text-anchor="middle">upper plane k+1</text>

  <rect x="126" y="626" width="948" height="38" rx="12" fill="#f7f1df" stroke="#c6a051"/>
  <text class="formula" x="600" y="650" text-anchor="middle">J_r,i = w_i I(t) l_s / (A_d,i Δr_control,i)   and   Σ J_r,i A_d,i Δr_control,i = I(t) l_s</text>
  <text class="tiny" x="1160" y="676" text-anchor="end">If the altitude lies exactly on a radial plane, the radial stencil collapses from two layers to one.</text>
</svg>
