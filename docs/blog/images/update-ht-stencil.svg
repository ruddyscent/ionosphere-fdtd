<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Tangential magnetic-field update stencil</title>
  <desc id="desc">Surface and radial views showing tangential magnetic field H t on a dual edge, radial electric field E r at primal vertices, and tangential electric field E t on neighboring TE-r planes.</desc>
  <defs>
    <marker id="arrow-grid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #172033; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .grid { fill: none; stroke: #334155; stroke-width: 3; }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .e { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrow-e); }
      .h { fill: none; stroke: #c2410c; stroke-width: 6; marker-end: url(#arrow-h); }
      .target { fill: #fef3c7; stroke: #f59e0b; stroke-width: 4; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 17px; }
      .op { font-size: 19px; font-weight: 700; fill: #475569; }
    </style>
  </defs>
  <rect width="1000" height="470" fill="white"/>
  <text x="34" y="40" class="heading">1. Update H_t at a primal/dual edge crossing</text>

  <rect x="25" y="62" width="460" height="335" rx="14" class="panel"/>
  <text x="48" y="94" class="label">Surface stencil on TM-r plane r_i</text>
  <line x1="93" y1="225" x2="417" y2="225" class="grid" marker-end="url(#arrow-grid)"/>
  <text x="177" y="256" class="small">oriented primal edge</text>
  <line x1="255" y1="118" x2="255" y2="330" class="guide"/>
  <text x="270" y="323" class="small">dual edge</text>
  <circle cx="105" cy="225" r="8" fill="#2563eb"/>
  <circle cx="405" cy="225" r="8" fill="#2563eb"/>
  <line x1="105" y1="215" x2="105" y2="157" class="e"/>
  <line x1="405" y1="215" x2="405" y2="157" class="e"/>
  <text x="59" y="143" class="label" fill="#2563eb">E_r(tail)</text>
  <text x="365" y="143" class="label" fill="#2563eb">E_r(head)</text>
  <circle cx="255" cy="225" r="22" class="target"/>
  <line x1="255" y1="276" x2="255" y2="172" class="h"/>
  <text x="282" y="211" class="label" fill="#c2410c">target H_t</text>
  <path d="M 143 193 C 200 164, 312 164, 368 193" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-grid)"/>
  <text x="219" y="151" class="op">D_s E_r</text>

  <rect x="515" y="62" width="460" height="335" rx="14" class="panel"/>
  <text x="538" y="94" class="label">Radial stencil at the same edge</text>
  <line x1="560" y1="145" x2="927" y2="145" class="guide"/>
  <line x1="560" y1="230" x2="927" y2="230" class="grid"/>
  <line x1="560" y1="315" x2="927" y2="315" class="guide"/>
  <text x="815" y="134" class="small">TE-r: r_i+1/2</text>
  <text x="815" y="219" class="small">TM-r: r_i</text>
  <text x="815" y="304" class="small">TE-r: r_i-1/2</text>
  <line x1="610" y1="145" x2="715" y2="145" class="e"/>
  <line x1="610" y1="315" x2="715" y2="315" class="e"/>
  <text x="729" y="173" class="label" fill="#2563eb">E_t(+)</text>
  <text x="729" y="343" class="label" fill="#2563eb">E_t(-)</text>
  <circle cx="664" cy="230" r="22" class="target"/>
  <line x1="610" y1="230" x2="715" y2="230" class="h"/>
  <text x="729" y="263" class="label" fill="#c2410c">target H_t</text>
  <path d="M 585 154 L 585 306" fill="none" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow-grid)" marker-end="url(#arrow-grid)"/>
  <text x="598" y="204" class="op">D_r E_t</text>

  <circle cx="37" cy="432" r="10" class="target"/><text x="55" y="439" class="small">updated degree of freedom</text>
  <line x1="310" y1="432" x2="355" y2="432" class="e"/><text x="368" y="439" class="small">electric input</text>
  <line x1="535" y1="432" x2="580" y2="432" class="h"/><text x="593" y="439" class="small">magnetic target</text>
</svg>
