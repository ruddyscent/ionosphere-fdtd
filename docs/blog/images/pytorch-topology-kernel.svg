<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic PyTorch topology kernels</title>
  <desc id="desc">Device-resident incidence tables gather complete tensor rows. Triangular circulation accumulates three signed corners, while dual-cell circulation accumulates six signed slots and uses a zero sign for the padded pentagon slot. The fixed operation sequence is deterministic and suitable for static graph compilation.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2878a8"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7453a6"/></marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .panel-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .step { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .mono { font: 600 11.7px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334a60; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .badge { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#fff"/>
  <text class="title" x="40" y="45">Topology becomes a fixed sequence of device tensor operations</text>
  <text class="subtitle" x="40" y="71">The current backend gathers padded incidence slots in a deterministic order; it does not scatter with index_add_.</text>

  <!-- Shared resident tensors -->
  <rect x="40" y="96" width="1120" height="72" rx="14" fill="#eef3f7" stroke="#c7d3de"/>
  <text class="step" x="62" y="121">Inputs on device</text>
  <rect x="205" y="108" width="266" height="46" rx="9" fill="#e5f1f8" stroke="#78a8c5"/>
  <text class="mono" x="338" y="128" text-anchor="middle">edge_values · (N_e, ...)</text>
  <text class="tiny" x="338" y="146" text-anchor="middle">field rows and all trailing radial values</text>
  <rect x="493" y="108" width="300" height="46" rx="9" fill="#eee8f7" stroke="#9b83bb"/>
  <text class="mono" x="643" y="128" text-anchor="middle">incidence indices · torch.long</text>
  <text class="tiny" x="643" y="146" text-anchor="middle">face_edges or vertex_edges</text>
  <rect x="815" y="108" width="316" height="46" rx="9" fill="#f7f1df" stroke="#c6a051"/>
  <text class="mono" x="973" y="128" text-anchor="middle">incidence signs · field dtype</text>
  <text class="tiny" x="973" y="146" text-anchor="middle">+1, −1, and pentagon padding 0</text>

  <!-- Face panel -->
  <rect x="40" y="190" width="534" height="382" rx="18" fill="#f6fafe" stroke="#a8c5d8" stroke-width="1.5"/>
  <text class="panel-title" x="64" y="225">Triangular face circulation</text>
  <text class="small" x="64" y="248">three known corners · output (N_f, ...)</text>

  <rect x="64" y="272" width="486" height="60" rx="10" fill="#fff" stroke="#9cb9cc"/>
  <text class="mono" x="80" y="296">result = edge_values[face_edges[:, 0]]</text>
  <text class="mono" x="80" y="317">result.mul_(face_edge_signs[:, 0].reshape(sign_shape))</text>
  <path d="M307 334 L307 357" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="64" y="359" width="486" height="100" rx="10" fill="#e6f1f8" stroke="#72a4c3"/>
  <text class="mono" x="80" y="383">for corner in (1, 2):</text>
  <text class="mono" x="98" y="406">term = edge_values[face_edges[:, corner]]</text>
  <text class="mono" x="98" y="429">term.mul_(face_edge_signs[:, corner].reshape(sign_shape))</text>
  <text class="mono" x="98" y="452">result.add_(term)</text>

  <rect x="108" y="483" width="398" height="60" rx="12" fill="#dcecf6" stroke="#5c94b8" stroke-width="1.5"/>
  <text class="step" x="307" y="508" text-anchor="middle">3 signed gathers → one face tensor</text>
  <text class="small" x="307" y="530" text-anchor="middle">vectorized across every face and trailing value</text>

  <!-- Dual panel -->
  <rect x="598" y="190" width="562" height="382" rx="18" fill="#fbf9fe" stroke="#b7a5d1" stroke-width="1.5"/>
  <text class="panel-title" x="622" y="225">Dual-cell circulation</text>
  <text class="small" x="622" y="248">six padded slots · output (N_v, ...)</text>

  <rect x="622" y="272" width="514" height="60" rx="10" fill="#fff" stroke="#b8a8cd"/>
  <text class="mono" x="638" y="296">result = edge_values[vertex_edges[:, 0]]</text>
  <text class="mono" x="638" y="317">result.mul_(vertex_edge_signs[:, 0].reshape(sign_shape))</text>
  <path d="M879 334 L879 357" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="622" y="359" width="514" height="100" rx="10" fill="#eee8f7" stroke="#9478b7"/>
  <text class="mono" x="638" y="383">for slot in range(1, 6):</text>
  <text class="mono" x="656" y="406">term = edge_values[vertex_edges[:, slot]]</text>
  <text class="mono" x="656" y="429">term.mul_(vertex_edge_signs[:, slot].reshape(sign_shape))</text>
  <text class="mono" x="656" y="452">result.add_(term)</text>

  <rect x="652" y="483" width="454" height="60" rx="12" fill="#e9e1f3" stroke="#8465ad" stroke-width="1.5"/>
  <text class="step" x="879" y="508" text-anchor="middle">6 signed gathers → one dual-cell tensor</text>
  <text class="small" x="879" y="530" text-anchor="middle">pentagon slot 5 contributes exactly zero</text>

  <!-- Compile properties -->
  <rect x="120" y="600" width="960" height="53" rx="14" fill="#f1f4f7" stroke="#cbd5df"/>
  <rect x="145" y="614" width="214" height="25" rx="12.5" fill="#dff1ec"/>
  <text class="badge" x="252" y="632" text-anchor="middle" fill="#287d6b">fixed operation count</text>
  <rect x="376" y="614" width="214" height="25" rx="12.5" fill="#deedf6"/>
  <text class="badge" x="483" y="632" text-anchor="middle" fill="#286f9a">fixed tensor shapes</text>
  <rect x="607" y="614" width="214" height="25" rx="12.5" fill="#eee8f7"/>
  <text class="badge" x="714" y="632" text-anchor="middle" fill="#684695">deterministic order</text>
  <rect x="838" y="614" width="214" height="25" rx="12.5" fill="#f6ead1"/>
  <text class="badge" x="945" y="632" text-anchor="middle" fill="#946615">static-graph friendly</text>
  <text class="tiny" x="1160" y="670" text-anchor="end">In-place mul_ and add_ reduce intermediate allocations without changing the incidence operator.</text>
</svg>
