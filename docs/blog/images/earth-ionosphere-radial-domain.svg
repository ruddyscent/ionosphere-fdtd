<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Radial computational domain through the Earth-ionosphere waveguide</title>
  <desc id="desc">A vertical altitude section extends from minus 100 kilometres in the lossy lithosphere to plus 100 kilometres in the conductive lower ionosphere. Sea level, the source at 2.5 kilometres, and PEC radial terminations are marked. A qualitative conductivity profile shows constant lithosphere conductivity and an exponential atmospheric increase with altitude.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#647689"/></marker>
    <linearGradient id="air" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#eef8fc"/><stop offset="0.55" stop-color="#e8f3f8"/><stop offset="1" stop-color="#f3e9d6"/></linearGradient>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .panel-title { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .formula { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #394e63; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#fff"/>
  <text class="title" x="40" y="45">The simulation resolves a 200 km radial slice everywhere on Earth</text>
  <text class="subtitle" x="40" y="71">The physical waveguide lies inside the domain; its numerical end caps are embedded in strongly conducting material.</text>

  <!-- Radial material stack -->
  <rect x="34" y="99" width="680" height="498" rx="19" fill="#f7fafc" stroke="#becbd7"/>
  <text class="panel-title" x="61" y="135">Radial material stack</text>
  <path d="M107 548 L107 157" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="81" y="573">altitude h</text>

  <rect x="158" y="164" width="456" height="190" fill="url(#air)" stroke="#94b8c9"/>
  <rect x="158" y="354" width="456" height="190" fill="#adc4cf" stroke="#52758a"/>
  <line x1="141" y1="354" x2="642" y2="354" stroke="#263f54" stroke-width="3"/>
  <text class="label" x="178" y="378">sea level · h = 0</text>

  <rect x="158" y="149" width="456" height="21" rx="5" fill="#4e6578"/>
  <rect x="158" y="538" width="456" height="21" rx="5" fill="#4e6578"/>
  <text class="small" x="601" y="164" text-anchor="end" style="fill:#fff">PEC radial termination · +100 km</text>
  <text class="small" x="601" y="553" text-anchor="end" style="fill:#fff">PEC radial termination · −100 km</text>

  <text class="label" x="386" y="210" text-anchor="middle">conductive lower ionosphere</text>
  <text class="small" x="386" y="230" text-anchor="middle">σ(h) rises exponentially</text>
  <text class="label" x="386" y="312" text-anchor="middle">atmospheric waveguide</text>
  <text class="small" x="386" y="332" text-anchor="middle">εr = 1 in the baseline</text>
  <text class="label" x="386" y="449" text-anchor="middle">lossy lithosphere</text>
  <text class="formula" x="386" y="472" text-anchor="middle">σ = 10⁻³ S/m · εr = 10</text>

  <!-- Source -->
  <line x1="158" y1="349" x2="614" y2="349" stroke="#d39126" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="521" cy="349" r="8" fill="#d39126" stroke="#fff" stroke-width="2"/>
  <path d="M521 349 L521 314" stroke="#b76d19" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="431" y="274" width="178" height="31" rx="11" fill="#fff7df" stroke="#d5ab52"/>
  <text class="label" x="520" y="295" text-anchor="middle" fill="#946615">radial source · +2.5 km</text>

  <!-- altitude ticks -->
  <g class="small" text-anchor="end">
    <line x1="97" y1="164" x2="117" y2="164" stroke="#647689"/><text x="91" y="168">+100 km</text>
    <line x1="97" y1="259" x2="117" y2="259" stroke="#647689"/><text x="91" y="263">+50</text>
    <line x1="97" y1="354" x2="117" y2="354" stroke="#647689"/><text x="91" y="358">0</text>
    <line x1="97" y1="449" x2="117" y2="449" stroke="#647689"/><text x="91" y="453">−50</text>
    <line x1="97" y1="544" x2="117" y2="544" stroke="#647689"/><text x="91" y="548">−100 km</text>
  </g>

  <!-- Conductivity profile -->
  <rect x="746" y="99" width="422" height="498" rx="19" fill="#fbf9fe" stroke="#b7a5d1"/>
  <text class="panel-title" x="774" y="135">Baseline conductivity with altitude</text>
  <text class="small" x="774" y="158">qualitative log-scale profile</text>
  <path d="M817 529 L817 185 M817 529 L1125 529" fill="none" stroke="#647689" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="763" y="357" text-anchor="middle" transform="rotate(-90 763 357)">altitude h</text>
  <text class="small" x="1120" y="552" text-anchor="end">conductivity σ · log scale</text>
  <line x1="817" y1="356" x2="1125" y2="356" stroke="#9faeba" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="tiny" x="807" y="360" text-anchor="end">0 km</text>
  <line x1="817" y1="226" x2="1125" y2="226" stroke="#d5ab52" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="tiny" x="807" y="230" text-anchor="end">74 km</text>
  <path d="M870 512 L870 356 C876 323 887 294 906 270 C938 230 995 205 1090 190" fill="none" stroke="#7453a6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="938" cy="246" r="6" fill="#d39126" stroke="#fff" stroke-width="2"/>
  <text class="small" x="951" y="250" fill="#946615">H′ = 74 km</text>
  <text class="tiny" x="883" y="493" fill="#5a6d7d">lithosphere baseline</text>
  <text class="tiny" x="976" y="318" fill="#684695">exponential atmosphere</text>
  <rect x="789" y="566" width="336" height="24" rx="10" fill="#eee8f7"/>
  <text class="formula" x="957" y="583" text-anchor="middle">σ(h) ∝ exp((h − H′) / ζ)</text>

  <rect x="150" y="615" width="900" height="31" rx="12" fill="#eef3f7"/>
  <text class="label" x="600" y="636" text-anchor="middle">The ±100 km end caps close the numerical domain; they are not claimed as sharp physical interfaces.</text>
</svg>
