<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Data flow through one vectorized NumPy FDTD time step</title>
  <desc id="desc">Two magnetic updates run first: Er and Et update Ht, while Et updates Hr. The new magnetic fields then drive two electric updates: Ht and a source update Er, while Hr and Ht update Et. Every operator is annotated with its array shape.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2878a8"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7453a6"/></marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#647689"/></marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172333; }
      .subtitle { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #536273; }
      .stage { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #243548; }
      .field { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #213447; }
      .shape { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #42566b; }
      .op { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #30455a; }
      .small { font: 400 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5b6d80; }
      .tiny { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #65778a; }
      .formula { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #394e63; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fff"/>
  <text class="title" x="40" y="45">One NumPy step is four shape-preserving pipelines</text>
  <text class="subtitle" x="40" y="71">Topology changes the surface-entity axis; radial differences change the staggered radial axis.</text>

  <!-- Magnetic stage -->
  <rect x="32" y="96" width="1136" height="278" rx="18" fill="#f5fafe" stroke="#a9c5d8" stroke-width="1.5"/>
  <rect x="48" y="112" width="232" height="37" rx="18.5" fill="#dcecf6"/>
  <text class="stage" x="164" y="138" text-anchor="middle">1 · Magnetic half-step</text>

  <!-- Ht pipeline -->
  <rect x="58" y="170" width="142" height="66" rx="11" fill="#deedf6" stroke="#6a9fc0"/>
  <text class="field" x="129" y="196" text-anchor="middle">E_r</text>
  <text class="shape" x="129" y="218" text-anchor="middle">(N_v, N_r + 1)</text>
  <rect x="58" y="271" width="142" height="66" rx="11" fill="#eee7f7" stroke="#9278b5"/>
  <text class="field" x="129" y="297" text-anchor="middle">E_t</text>
  <text class="shape" x="129" y="319" text-anchor="middle">(N_e, N_r)</text>

  <rect x="252" y="166" width="230" height="78" rx="11" fill="#fff" stroke="#8eb2c9"/>
  <text class="op" x="367" y="190" text-anchor="middle">surface edge difference</text>
  <text class="formula" x="367" y="211" text-anchor="middle">E_r[head] − E_r[tail]</text>
  <text class="shape" x="367" y="231" text-anchor="middle">→ (N_e, N_r + 1)</text>
  <rect x="252" y="267" width="230" height="78" rx="11" fill="#fff" stroke="#a38bc5"/>
  <text class="op" x="367" y="291" text-anchor="middle">radial difference + PEC</text>
  <text class="formula" x="367" y="312" text-anchor="middle">diff_r(E_t)</text>
  <text class="shape" x="367" y="332" text-anchor="middle">→ (N_e, N_r + 1)</text>
  <path d="M200 203 L250 203" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M200 304 L250 304" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="524" y="198" width="220" height="111" rx="12" fill="#e5f2f8" stroke="#5b94b8" stroke-width="1.5"/>
  <text class="op" x="634" y="224" text-anchor="middle">combine metric curls</text>
  <text class="formula" x="634" y="247" text-anchor="middle">grad_s(E_r) − diff_r(E_t)</text>
  <text class="small" x="634" y="270" text-anchor="middle">scale by dt / mu0</text>
  <text class="field" x="634" y="296" text-anchor="middle">H_t += temporary</text>
  <path d="M482 205 C505 205 503 231 522 231" fill="none" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M482 306 C505 306 503 276 522 276" fill="none" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Hr pipeline -->
  <rect x="780" y="166" width="206" height="78" rx="11" fill="#fff" stroke="#c29a58"/>
  <rect x="650" y="160" width="96" height="30" rx="15" fill="#eee7f7" stroke="#9278b5"/>
  <text class="shape" x="698" y="180" text-anchor="middle">E_t reuse</text>
  <path d="M746 175 C764 175 760 205 778 205" fill="none" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text class="op" x="883" y="190" text-anchor="middle">signed face circulation</text>
  <text class="formula" x="883" y="211" text-anchor="middle">sum(E_t · edge length)</text>
  <text class="shape" x="883" y="231" text-anchor="middle">→ (N_f, N_r)</text>
  <rect x="780" y="267" width="328" height="78" rx="11" fill="#f7ead5" stroke="#bf8e3e" stroke-width="1.5"/>
  <text class="op" x="944" y="292" text-anchor="middle">divide by face area · scale dt / mu0</text>
  <text class="field" x="944" y="321" text-anchor="middle">H_r −= circulation</text>
  <text class="shape" x="1087" y="321" text-anchor="end">(N_f, N_r)</text>
  <path d="M883 244 L883 265" stroke="#647689" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Stage handoff -->
  <path d="M634 310 L634 411" stroke="#2878a8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M944 346 L944 411" stroke="#7453a6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text class="small" x="645" y="393">new H_t</text>
  <text class="small" x="955" y="393">new H_r</text>

  <!-- Electric stage -->
  <rect x="32" y="412" width="1136" height="278" rx="18" fill="#fbf9fe" stroke="#b7a5d1" stroke-width="1.5"/>
  <rect x="48" y="428" width="222" height="37" rx="18.5" fill="#e9e1f3"/>
  <text class="stage" x="159" y="454" text-anchor="middle">2 · Electric full-step</text>

  <!-- Er update -->
  <rect x="58" y="490" width="210" height="82" rx="11" fill="#fff" stroke="#7ba7c4"/>
  <text class="op" x="163" y="515" text-anchor="middle">dual-cell circulation</text>
  <text class="formula" x="163" y="537" text-anchor="middle">sum(H_t · dual length)</text>
  <text class="shape" x="163" y="558" text-anchor="middle">→ (N_v, N_r + 1)</text>
  <rect x="58" y="598" width="210" height="51" rx="10" fill="#f7f1df" stroke="#c6a051"/>
  <text class="op" x="163" y="621" text-anchor="middle">indexed source current</text>
  <text class="shape" x="163" y="640" text-anchor="middle">selected (vertex, layer)</text>
  <path d="M634 412 C520 455 345 474 270 514" fill="none" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="316" y="505" width="250" height="118" rx="12" fill="#e5f2f8" stroke="#5b94b8" stroke-width="1.5"/>
  <text class="op" x="441" y="532" text-anchor="middle">lossy in-place update</text>
  <text class="formula" x="441" y="557" text-anchor="middle">E_r *= C_a</text>
  <text class="formula" x="441" y="579" text-anchor="middle">E_r += C_b · circulation</text>
  <text class="formula" x="441" y="601" text-anchor="middle">E_r −= C_b · J_source</text>
  <path d="M268 531 L314 545" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M268 623 L314 592" stroke="#b58628" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text class="field" x="441" y="665" text-anchor="middle">E_r (N_v, N_r + 1)</text>

  <!-- Et update -->
  <rect x="626" y="490" width="216" height="82" rx="11" fill="#fff" stroke="#a38bc5"/>
  <text class="op" x="734" y="515" text-anchor="middle">dual-edge difference</text>
  <text class="formula" x="734" y="537" text-anchor="middle">H_r[left] − H_r[right]</text>
  <text class="shape" x="734" y="558" text-anchor="middle">→ (N_e, N_r)</text>
  <rect x="626" y="598" width="216" height="51" rx="10" fill="#fff" stroke="#7ba7c4"/>
  <text class="op" x="734" y="621" text-anchor="middle">radial difference of H_t</text>
  <text class="shape" x="734" y="640" text-anchor="middle">→ (N_e, N_r)</text>
  <path d="M944 412 C893 451 847 474 815 490" fill="none" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M634 412 C624 474 635 550 681 596" fill="none" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="890" y="505" width="218" height="118" rx="12" fill="#eee8f7" stroke="#8e72b4" stroke-width="1.5"/>
  <text class="op" x="999" y="532" text-anchor="middle">lossy in-place update</text>
  <text class="formula" x="999" y="557" text-anchor="middle">curl = diff_s(H_r) − diff_r(H_t)</text>
  <text class="formula" x="999" y="580" text-anchor="middle">E_t *= C_a</text>
  <text class="formula" x="999" y="602" text-anchor="middle">E_t += C_b · curl</text>
  <path d="M842 531 L888 545" stroke="#7453a6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M842 623 L888 592" stroke="#2878a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="field" x="999" y="665" text-anchor="middle">E_t (N_e, N_r)</text>

  <rect x="154" y="712" width="892" height="30" rx="15" fill="#eef2f6"/>
  <text class="small" x="600" y="732" text-anchor="middle">Persistent fields update in place; gathered differences and circulations are temporary arrays with the target field's shape.</text>
</svg>
