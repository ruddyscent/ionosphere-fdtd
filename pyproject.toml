[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ionosphere-fdtd"
version = "0.2.0"
description = "PyTorch geodesic FDTD model of the Earth-ionosphere waveguide"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Kyungwon Chun", email = "ruddyscent@gmail.com" },
]
keywords = [
    "electromagnetics",
    "fdtd",
    "geodesic-grid",
    "ionosphere",
    "maxwell-equations",
]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "torch>=2.5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ruddyscent/ionosphere-fdtd"
Documentation = "https://github.com/ruddyscent/ionosphere-fdtd/tree/master/docs/manual"
Repository = "https://github.com/ruddyscent/ionosphere-fdtd"
Issues = "https://github.com/ruddyscent/ionosphere-fdtd/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
tensorboard = [
    "tensorboard>=2.18",
    "tensorboardX>=2.6.2",
]
visualization = [
    "cartopy>=0.24",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
    "pillow>=11",
    "pyvista>=0.45",
]
verification = ["scipy>=1.15"]

[project.scripts]
ionosphere = "ionosphere_fdtd.cli:main"
ionosphere-visualize = "ionosphere_fdtd.viz_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "verification/tests"]
pythonpath = ["."]
