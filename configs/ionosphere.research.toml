# Explicit PyTorch CUDA/float32 template for a long forward-only run. Confirm
# device availability, compile break-even, and memory before using this file;
# it is not the beginner quick start and is not portable to MPS unchanged.
[ionosphere]
steps = 20000
report_every = 1000
subdivision = 5
radial_cells = 40
courant = 0.35

device = "cuda:0"
dtype = "float32"
torch_compile = true
torch_compile_chunk_size = 32

source_current = 1.0e6
source_length = 5000.0
source_frequency = 20.0
source_latitude = 35.1595
source_longitude = 126.8526

checkpoint = "artifacts/runs/research.npz"
checkpoint_every = 5000

[visualization]
resume = "artifacts/runs/research.npz"
steps = 0
device = "cuda:0"
dtype = "float32"

[visualization.surface]
component = "er"
altitude_km = 0.0
projection = "mollweide"
scale = "symlog"
coastlines = false
output = "artifacts/figures/research-surface.png"

[visualization.traces]
trace_steps = 10000
sample_every = 10
receiver = [
  [35.1595, 126.8526, 0.0],
  [-35.1595, -53.1474, 0.0],
]
output = "artifacts/figures/research-traces.png"
