# Required PyTorch runtime with CPU/float64-safe defaults for a first run.
[ionosphere]
steps = 200
report_every = 20
subdivision = 2
radial_cells = 24
courant = 0.35

device = "cpu"
dtype = "float64"
torch_compile = false
torch_compile_chunk_size = 8

source_current = 1.0e6
source_length = 5000.0
source_frequency = 0.0
source_latitude = 35.1595
source_longitude = 126.8526

checkpoint = "artifacts/runs/demo.npz"

# Render the exact model and fields saved by the simulation above.
[visualization]
resume = "artifacts/runs/demo.npz"
steps = 0
device = "cpu"
dtype = "float64"

[visualization.surface]
component = "er"
altitude_km = 0.0
projection = "mollweide"
scale = "symlog"
coastlines = false
output = "artifacts/figures/demo-surface.png"

[visualization.traces]
trace_steps = 1000
sample_every = 10
receiver = [
  [35.1595, 126.8526, 0.0],
  [-35.1595, -53.1474, 0.0],
]
output = "artifacts/figures/demo-traces.png"
